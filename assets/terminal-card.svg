<svg width="520" height="300" viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="520" height="300" rx="4" fill="#0A0A0A" stroke="#00FF41" stroke-opacity="0.35"/>

  <!-- title bar -->
  <rect width="520" height="28" rx="4" fill="#101410"/>
  <rect y="24" width="520" height="4" fill="#0A0A0A"/>
  <text x="16" y="19" font-family="Courier New, monospace" font-size="12" fill="#00FF41">yashas@root: ~/profile</text>

  <!-- body -->
  <g font-family="Courier New, monospace" font-size="14" fill="#00FF41" filter="url(#glow)">
    <text x="18" y="54">$ whoami</text>
    <text x="18" y="76" fill="#D9FFE0">Yashas MN</text>

    <text x="18" y="106">$ cat profile.info</text>
    <text x="18" y="130" fill="#D9FFE0">College   : RV College of Engineering</text>
    <text x="18" y="150" fill="#D9FFE0">Location  : Bengaluru, IN</text>
    <text x="18" y="170" fill="#D9FFE0">Status    : Software Engineer / Building</text>
    <text x="18" y="190" fill="#D9FFE0">Joined    : [ADD JOIN DATE]</text>
    <text x="18" y="210" fill="#D9FFE0">Focus     : [ADD YOUR FOCUS AREA]</text>

    <text x="18" y="240">$ uptime</text>
    <text x="18" y="262" fill="#D9FFE0">on the grid since [ADD JOIN DATE]</text>

    <text x="18" y="290">$ _</text>
  </g>
</svg>
