  <rect x="74" y="72" width="1052" height="276" rx="22" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
  <rect x="74" y="72" width="1052" height="52" rx="22" fill="#1F2933"/>
  <circle cx="108" cy="98" r="8" fill="#E66D55"/>
  <circle cx="134" cy="98" r="8" fill="#E6B450"/>
